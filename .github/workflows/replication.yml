name: Replication
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  table1:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.24"
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen v2v-replicate
      - run: uv run --frozen v2v-replicate --offline --output-dir outputs/offline
      - run: diff outputs/table1/table1.csv outputs/offline/table1.csv
      - run: uv run --frozen python tools/build_release.py
