[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-to-value-replication"
version = "0.1.0"
description = "Reproduce Table 1 of From vision to value from the authors' released portfolio returns"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "statsmodels==0.14.4",
]

[project.scripts]
v2v-replicate = "vision_to_value.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "docs/UPSTREAM_LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vision_to_value = ["*.json", "*.csv"]
