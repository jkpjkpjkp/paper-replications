[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arboreal-reproduction"
version = "0.1.0"
description = "Independent reproduction of Arboreal Neural Network (ICML 2026)"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.26", "scipy", "pandas", "scikit-learn", "xgboost>=2", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["arboreal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
