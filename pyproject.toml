[project]
name = "hermes-reproduction"
version = "0.1.0"
description = "Independent equation-based reproduction of Hermes stock forecasting"
requires-python = ">=3.11,<3.12"
dependencies = ["torch==2.9.1", "numpy==2.3.5", "pandas==2.3.3", "scipy==1.16.3", "matplotlib==3.10.7", "pytest==8.4.2", "requests>=2.32", "pyarrow==21.0.0", "duckdb==1.4.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
